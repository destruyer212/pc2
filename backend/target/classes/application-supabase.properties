# ============================================================
# Supabase PostgreSQL vía POOLER (recomendado)
# Dashboard: Connect > Connection string > Session pooler
# ============================================================
#
# Session pooler  → puerto 5432  (mejor para Spring Boot + JPA)
# Transaction     → puerto 6543  (agregar prepareThreshold=0 en la URL)
#
# Usuario pooler: postgres.TU_PROJECT_REF  (NO solo "postgres")
# Host:          aws-0-XXXX.pooler.supabase.com
#
# Ejemplo Session pooler:
# SPRING_DATASOURCE_URL=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
# SPRING_DATASOURCE_USERNAME=postgres.abcdefghijklmnop
# SPRING_DATASOURCE_PASSWORD=tu_password
#
# Ejemplo Transaction pooler:
# SPRING_DATASOURCE_URL=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Con pooler use pocos conexiones (Supabase ya agrupa en el servidor)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
