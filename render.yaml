# Solo BACKEND en Render (requisito del profesor)
# Frontend Angular se ejecuta en local: npm start
#
# Pasos:
# 1. Subir repo a GitHub
# 2. Render → New → Blueprint (o Web Service manual)
# 3. Completar variables de Supabase
# 4. Probar: https://TU-SERVICIO.onrender.com/api/productos

services:
  - type: web
    name: pc2-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: supabase
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:4200
