<h1>Nueva tarea</h1>

@if (mensaje) {
  <div class="alert success">{{ mensaje }}</div>
}
@if (error) {
  <div class="alert error">{{ error }}</div>
}

<form class="form-card" (ngSubmit)="enviar()">
  <label>Título <input type="text" [(ngModel)]="titulo" name="titulo" required /></label>
  <label>Curso <input type="text" [(ngModel)]="curso" name="curso" required /></label>
  <label>Fecha de entrega <input type="date" [(ngModel)]="fechaEntrega" name="fechaEntrega" required /></label>
  <label>Estado <input type="text" [(ngModel)]="estado" name="estado" required /></label>
  <label>
    Prioridad
    <select [(ngModel)]="prioridad" name="prioridad" required>
      <option value="BAJA">Baja</option>
      <option value="MEDIA">Media</option>
      <option value="ALTA">Alta</option>
      <option value="URGENTE">Urgente</option>
    </select>
  </label>
  <button type="submit">Registrar tarea</button>
</form>
