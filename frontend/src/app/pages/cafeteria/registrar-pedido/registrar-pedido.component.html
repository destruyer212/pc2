<h1>Registrar pedido</h1>

@if (mensaje) {
  <div class="alert success">{{ mensaje }}</div>
}
@if (error) {
  <div class="alert error">{{ error }}</div>
}

<form class="form-card" (ngSubmit)="enviar()">
  <label>
    Nombre del estudiante
    <input type="text" [(ngModel)]="nombreEstudiante" name="nombreEstudiante" required />
  </label>

  <label>
    Producto
    <select [(ngModel)]="productoId" name="productoId" required>
      <option [ngValue]="null">Seleccione un producto</option>
      @for (producto of productos; track producto.id) {
        <option [ngValue]="producto.id">{{ producto.nombre }} (Stock: {{ producto.stock }})</option>
      }
    </select>
  </label>

  <label>
    Cantidad
    <input type="number" min="1" [(ngModel)]="cantidad" name="cantidad" required />
  </label>

  <label>
    Observación
    <textarea rows="3" [(ngModel)]="observacion" name="observacion"></textarea>
  </label>

  <button type="submit">Enviar pedido</button>
</form>
